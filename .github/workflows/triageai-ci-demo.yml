name: TriageAI CI Demo

# Runs the intentional-failure sample tests, then posts results to your
# local TriageAI backend (via TRIAGEAI_API_URL secret, usually a tunnel URL).

on:
  push:
    branches: [master, main, dev]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test-and-ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/python-sample

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests and capture output
        id: pytest
        run: |
          set +e
          pytest -v --tb=short --color=no 2>&1 | tee pytest-output.log
          echo "pytest_exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Parse pytest results
        id: parse
        run: |
          FAILED_COUNT=$(grep -c "FAILED" pytest-output.log || true)
          STATUS="passed"
          if [ "${FAILED_COUNT:-0}" -gt 0 ]; then
            STATUS="failed"
          fi

          FAILED_TESTS=$(grep "FAILED" pytest-output.log | awk '{print $2}' | paste -sd "," - || true)

          {
            echo "failed_count=$FAILED_COUNT"
            echo "status=$STATUS"
            echo "failed_tests=$FAILED_TESTS"
          } >> "$GITHUB_OUTPUT"

          echo "Detected status=$STATUS failed_count=$FAILED_COUNT"

      - name: Send results to TriageAI
        if: always()
        env:
          TRIAGEAI_URL: ${{ secrets.TRIAGEAI_API_URL }}
          REPO_NAME: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          PIPELINE_ID: ${{ github.run_id }}
          STATUS: ${{ steps.parse.outputs.status }}
          FAILED_TESTS: ${{ steps.parse.outputs.failed_tests }}
        run: |
          if [ -z "$TRIAGEAI_URL" ]; then
            echo "TRIAGEAI_API_URL secret is not set — skipping ingest."
            echo "Add a repo secret pointing at your tunnel URL (no trailing slash), e.g. https://xxxx.trycloudflare.com"
            exit 0
          fi

          # Strip trailing slash if present
          TRIAGEAI_URL="${TRIAGEAI_URL%/}"

          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          LOG_TEXT=$(cat pytest-output.log)

          PAYLOAD=$(jq -n \
            --arg repo_name "$REPO_NAME" \
            --arg branch "$BRANCH" \
            --arg commit_sha "$COMMIT_SHA" \
            --arg pipeline_id "$PIPELINE_ID" \
            --arg environment "github-actions" \
            --arg status "$STATUS" \
            --arg test_suite_name "python-sample" \
            --arg failed_test_names "${FAILED_TESTS:-}" \
            --arg raw_log_text "$LOG_TEXT" \
            --arg timestamp "$TIMESTAMP" \
            '{
              repo_name: $repo_name,
              branch: $branch,
              commit_sha: $commit_sha,
              pipeline_id: $pipeline_id,
              environment: $environment,
              status: $status,
              test_suite_name: $test_suite_name,
              failed_test_names: (if $failed_test_names == "" then [] else ($failed_test_names | split(",")) end),
              timestamp: $timestamp,
              raw_log_text: $raw_log_text
            }')

          echo "Posting CI run to ${TRIAGEAI_URL}/api/runs/ingest"
          echo "$PAYLOAD" | jq '{repo_name, branch, status, test_suite_name, failed_test_names, timestamp}'

          HTTP_CODE=$(curl -sS -o /tmp/triageai-response.json -w "%{http_code}" \
            -X POST "${TRIAGEAI_URL}/api/runs/ingest" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD") || true

          echo "HTTP status: $HTTP_CODE"
          cat /tmp/triageai-response.json || true
          echo

          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "Warning: TriageAI ingest returned HTTP $HTTP_CODE"
            exit 0
          fi

          echo "Ingest succeeded. Open http://localhost:3000 to view the run."
