version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: buildlens_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-buildlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buildlens_dev}
      POSTGRES_DB: ${POSTGRES_DB:-buildlens}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildlens"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: buildlens_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-buildlens}:${POSTGRES_PASSWORD:-buildlens_dev}@postgres:5432/${POSTGRES_DB:-buildlens}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-buildlens}:${POSTGRES_PASSWORD:-buildlens_dev}@postgres:5432/${POSTGRES_DB:-buildlens}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: buildlens_frontend
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev

volumes:
  postgres_data: